<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06100c" />
    <title>Snake</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <header id="top">
      <h1>Snake</h1>
      <div class="stats">
        <div class="stat"><span>Score</span><b id="currentScore">0</b></div>
        <div class="stat best"><span>Best</span><b id="highestScore">0</b></div>
      </div>
    </header>

    <div id="boardWrap">
      <canvas id="playGround"></canvas>
      <div id="startHint">
        <b>Ready?</b>
        <span id="hintText">Press an arrow key to start</span>
      </div>
    </div>

    <div id="dpad" aria-label="Direction controls">
      <button data-dir="up" class="up" aria-label="Up">
        <svg viewBox="0 0 24 24"><path d="M12 6l7 9H5z" /></svg>
      </button>
      <button data-dir="left" class="left" aria-label="Left">
        <svg viewBox="0 0 24 24"><path d="M6 12l9-7v14z" /></svg>
      </button>
      <button data-dir="right" class="right" aria-label="Right">
        <svg viewBox="0 0 24 24"><path d="M18 12l-9 7V5z" /></svg>
      </button>
      <button data-dir="down" class="down" aria-label="Down">
        <svg viewBox="0 0 24 24"><path d="M12 18l-7-9h14z" /></svg>
      </button>
    </div>

    <div id="lost">
      <div id="scoreContainer">
        <h2>Game Over</h2>
        <div class="final">
          <b id="score">0</b>
          <span id="newBest" hidden>New best!</span>
        </div>
        <p id="bestLine"></p>
        <button id="restartBtn">Play again</button>
        <p class="tiny" id="restartHint">or press Enter</p>
      </div>
    </div>
    <script src="script.js?v=2"></script>
  </body>
</html>
